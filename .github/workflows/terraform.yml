name: Terraform Infrastructure

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

env:
  TF_VERSION: '1.6.0'
  TF_WORKING_DIR: './terraform'

jobs:
  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init (backend-free validation)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  terraform-plan:
    name: Plan Infrastructure
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check DigitalOcean Credentials
        id: creds
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          SSH_PUB: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          if [ -n "$DO_TOKEN" ] && [ -n "$SSH_PUB" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Terraform plan skipped: DIGITALOCEAN_TOKEN or SSH_PUBLIC_KEY secret is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Terraform
        if: steps.creds.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create SSH key and terraform.tfvars
        if: steps.creds.outputs.configured == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > "${{ github.workspace }}/ssh_key.pub"
          cat > terraform.tfvars <<EOF
          do_token = "${{ secrets.DIGITALOCEAN_TOKEN }}"
          region = "nyc3"
          droplet_size = "s-2vcpu-4gb"
          jenkins_droplet_size = "s-2vcpu-4gb"
          ssh_public_key_path = "${{ github.workspace }}/ssh_key.pub"
          environment = "production"
          EOF

      - name: Terraform Init & Plan
        if: steps.creds.outputs.configured == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          terraform init -backend=false
          terraform plan -out=tfplan
